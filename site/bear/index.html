<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0f1e33}
  /* بک‌گراند اصلی: طول و عرض ثابت ۶۴۰×۴۰۰، دقیقاً وسط صفحه */
  #stage{
    position:absolute;left:50%;top:50%;
    width:640px;height:400px;
    min-width:640px;min-height:400px;
    max-width:640px;max-height:400px;
    transform:translate(-50%,-50%);
    overflow:hidden;border-radius:18px;
    background:linear-gradient(180deg,#8fd3ff 0%,#c9ecff 62%,#9be07a 62%,#6cc24a 100%);
  }
  #stage svg{position:absolute;left:0;top:0;width:640px;height:400px;display:block}
  .cloud{animation:drift 14s ease-in-out infinite alternate}
  .cloud.c2{animation-duration:18s}
  @keyframes drift{from{transform:translateX(-25px)}to{transform:translateX(25px)}}
  #bear{transform-origin:320px 345px;animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  #arm-r{transform-box:fill-box;transform-origin:20% 90%;animation:wave 2.4s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
</style>
</head>
<body>
<div id="stage">
  <svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" aria-label="bear">
    <!-- خورشید و ابر -->
    <circle cx="560" cy="70" r="34" fill="#ffe27a"/>
    <g class="cloud"><ellipse cx="110" cy="70" rx="48" ry="18" fill="#fff"/><ellipse cx="140" cy="58" rx="30" ry="20" fill="#fff"/></g>
    <g class="cloud c2"><ellipse cx="470" cy="120" rx="40" ry="15" fill="#fff" opacity=".9"/><ellipse cx="495" cy="110" rx="24" ry="16" fill="#fff" opacity=".9"/></g>

    <!-- خرس: مرکز افقی 320، کادر عمودی 70..330 => مرکز 200 -->
    <g transform="translate(0,-14)">
    <g id="bear">
      <ellipse cx="320" cy="345" rx="110" ry="13" fill="#000" opacity=".18"/>
      <!-- پاها -->
      <ellipse cx="268" cy="328" rx="36" ry="20" fill="#7a4a26"/>
      <ellipse cx="372" cy="328" rx="36" ry="20" fill="#7a4a26"/>
      <ellipse cx="268" cy="330" rx="18" ry="10" fill="#e8c39e"/>
      <ellipse cx="372" cy="330" rx="18" ry="10" fill="#e8c39e"/>
      <!-- بدن -->
      <ellipse cx="320" cy="270" rx="92" ry="78" fill="#8b5a2b"/>
      <ellipse cx="320" cy="284" rx="56" ry="50" fill="#e8c39e"/>
      <!-- دست‌ها -->
      <ellipse cx="236" cy="262" rx="24" ry="42" fill="#7a4a26" transform="rotate(18 236 262)"/>
      <g id="arm-r"><ellipse cx="404" cy="262" rx="24" ry="42" fill="#7a4a26" transform="rotate(-18 404 262)"/></g>
      <!-- گوش‌ها -->
      <circle cx="260" cy="98" r="28" fill="#8b5a2b"/>
      <circle cx="380" cy="98" r="28" fill="#8b5a2b"/>
      <circle cx="260" cy="98" r="15" fill="#e8a98e"/>
      <circle cx="380" cy="98" r="15" fill="#e8a98e"/>
      <!-- سر -->
      <circle cx="320" cy="158" r="76" fill="#9a6633"/>
      <!-- چشم‌ها -->
      <g class="eye"><circle cx="292" cy="146" r="9" fill="#1d1208"/><circle cx="295" cy="143" r="3" fill="#fff"/></g>
      <g class="eye"><circle cx="348" cy="146" r="9" fill="#1d1208"/><circle cx="351" cy="143" r="3" fill="#fff"/></g>
      <!-- لپ -->
      <ellipse cx="270" cy="178" rx="13" ry="8" fill="#ff9aa2" opacity=".6"/>
      <ellipse cx="370" cy="178" rx="13" ry="8" fill="#ff9aa2" opacity=".6"/>
      <!-- پوزه -->
      <ellipse cx="320" cy="186" rx="36" ry="27" fill="#e8c39e"/>
      <ellipse cx="320" cy="174" rx="13" ry="9" fill="#2a1a0e"/>
      <path d="M320 183 v8 M320 191 q-10 10 -18 2 M320 191 q10 10 18 2" stroke="#2a1a0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    </g>
  </svg>
</div>
</body>
</html>
