<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست ریزن</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #7c3aed, #db2777);
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 40px 50px; border-radius: 20px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  h1 { font-size: 2.2rem; margin-bottom: 12px; }
  p { opacity: .85; margin-bottom: 24px; }
  button {
    background: #fff; color: #7c3aed; border: none;
    padding: 12px 28px; border-radius: 30px;
    font-size: 1rem; cursor: pointer; font-family: inherit;
    transition: transform .2s;
  }
  button:hover { transform: scale(1.08); }
  #count { margin-top: 18px; font-size: 1.4rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>سلام از ریزن 👋</h1>
    <p>این یه سایت تستیه که برای متین ساخته شده</p>
    <button onclick="document.getElementById('count').textContent = ++window.c || (window.c = 1)">کلیک کن</button>
    <div id="count">0</div>
  </div>
</body>
</html>
